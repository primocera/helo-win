<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Plaza</title>
<style>
  * { box-sizing: border-box; }
  body {
    margin: 0;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 10px;
    padding: 16px;
    background: #14161c;
    color: #eef0f5;
    font-family: "Segoe UI", system-ui, sans-serif;
  }
  canvas {
    width: min(960px, 100%);
    aspect-ratio: 16 / 9;
    border-radius: 12px;
    background: #222;
    cursor: pointer;
  }
  .bar { width: min(960px, 100%); display: flex; gap: 8px; align-items: center; }
  input[type=text] {
    flex: 1;
    min-width: 0;
    height: 38px;
    padding: 0 12px;
    border: 1px solid #343846;
    border-radius: 8px;
    background: #1d2029;
    color: inherit;
    font: inherit;
  }
  button {
    height: 38px;
    padding: 0 16px;
    border: 0;
    border-radius: 8px;
    background: #4f8cff;
    color: #fff;
    font: inherit;
    font-weight: 600;
    cursor: pointer;
  }
  button.quiet { background: #2a2e3a; }
  #status { color: #9aa1b2; font-size: 14px; white-space: nowrap; }
  #join {
    width: min(360px, 100%);
    margin-top: 12vh;
    padding: 24px;
    border-radius: 14px;
    background: #1d2029;
    display: flex;
    flex-direction: column;
    gap: 14px;
  }
  #join h1 { margin: 0; font-size: 24px; }
  #join p { margin: 0; color: #9aa1b2; font-size: 14px; }
  #join label { display: flex; align-items: center; justify-content: space-between; gap: 12px; font-size: 14px; }
  #join input[type=text] { flex: none; width: 100%; }
  input[type=color] { width: 56px; height: 32px; padding: 0; border: 0; background: none; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
  <form id="join">
    <h1>Plaza</h1>
    <p id="room-line"></p>
    <input type="text" id="name" maxlength="16" placeholder="Your name" autocomplete="off">
    <label>Outfit colour <input type="color" id="body-color" value="#4f8cff"></label>
    <label>Skin tone <input type="color" id="skin-color" value="#f2c9a0"></label>
    <button type="submit">Enter</button>
  </form>

  <div id="game" hidden>
    <canvas id="canvas" width="960" height="540"></canvas>
    <form class="bar" id="chat-form">
      <input type="text" id="chat" maxlength="200" placeholder="Say something… (click the floor to walk)" autocomplete="off">
      <button type="submit">Send</button>
      <button type="button" class="quiet" id="invite">Copy invite link</button>
      <span id="status"></span>
    </form>
  </div>
  <script src="client.js"></script>
</body>
</html>
