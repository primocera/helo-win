<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Helo</title>
<style>
  body { width: 300px; margin: 0; padding: 14px; font: 13px "Segoe UI", system-ui, sans-serif; background: #111113; color: #f2f2f5; }
  h1 { margin: 0 0 6px; font-size: 15px; }
  p { margin: 0 0 10px; color: #a6a6ae; line-height: 1.4; }
  input { width: 100%; box-sizing: border-box; height: 32px; padding: 0 8px; border: 1px solid #34343a; border-radius: 8px; background: #0b0b0c; color: inherit; font: 12px Consolas, monospace; }
  button { margin-top: 8px; width: 100%; height: 32px; border: 0; border-radius: 8px; background: #2b6be4; color: #fff; font: inherit; font-weight: 600; cursor: pointer; }
  #status { margin: 10px 0 0; min-height: 18px; }
  #status.ok { color: #3ddc84; }
  #status.bad { color: #ff7b72; }
</style>
</head>
<body>
  <h1>Helo</h1>
  <p>In Helo, open Settings → AI agents → Claude and ChatGPT in the browser, copy the pairing code and paste it here.</p>
  <input id="code" placeholder="Pairing code" spellcheck="false" autocomplete="off">
  <button id="save" type="button">Save and test</button>
  <p id="status"></p>
  <script src="popup.js"></script>
</body>
</html>
